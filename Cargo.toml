[package]
name = "this-repo-has-stars"
version = "0.1.0"
edition = "2021"
authors = ["hzzmonetvn <hzzmonet7@gmail.com>"]
description = "High-performance dynamic GitHub repository star synchronizer"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
